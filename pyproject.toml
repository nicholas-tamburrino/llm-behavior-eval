[project]
name = "llm-behavior-eval"
version = "0.1.0"
description = "Small, repeatable, rule-based behavior tests for chat assistants. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicholas J. Tamburrino" }]
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llm_behavior_eval"]
