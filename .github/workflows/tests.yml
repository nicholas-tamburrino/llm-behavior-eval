name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example run (exit code 1 means some fixture cases fail, which is expected)
        run: |
          python -m llm_behavior_eval run --cases examples/cases.json --adapter fixture --fixtures examples/fixtures.jsonl || [ $? -eq 1 ]
